name: Publish release
# Publishes a tagged semver release (vX.Y.Z):
#   - npm `traceyard`, with provenance, and GitHub Packages `@fysaio/traceyard`
#   - ghcr.io/fysaio/traceyard and ghcr.io/fysaio/traceyard-runner for
#     linux/amd64 and linux/arm64, with SBOM and provenance attestations,
#     signed keylessly with cosign
#   - a GitHub release, and the moving major tag (v1) for the action
# Run it by hand with "dry run" to build everything without publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # One global lock protects mutable aliases such as latest and v1 across tags.
  group: traceyard-publish
  cancel-in-progress: false
env:
  PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"
  DO_NOT_TRACK: "1"
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject an untagged non-dry-run dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo '::error::Manual publishing is disabled. Push a matching semver tag from main, or select dry run.'
            exit 1
          fi
      - name: Check the tag matches the package versions
        id: version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version. Bump the version, then tag."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -q "^## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - name: Reject a version rollback
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest_version=${latest_tag#v}
          if [ -z "$latest_version" ]; then
            echo 'No prior GitHub release found; accepting the first release.'
            exit 0
          fi
          if [ "$(printf '%s\n' "$latest_version" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::Release $VERSION is older than the latest published release $latest_tag; refusing to move mutable aliases backward."
            exit 1
          fi
      - name: Check the tagged commit passed CI on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=50 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point at a commit on main."; exit 1; }

  npm:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: CLI and MCP tests
        run: npx vitest run --project unit tests/unit/cli.test.ts tests/unit/cli-mcp.test.ts
      - name: Build the packages
        run: |
          node scripts/pack-cli.mjs
          node scripts/pack-cli.mjs --name @fysaio/traceyard --out dist/npm/fysaio-traceyard
      - name: Smoke test the packed CLI from a clean install
        run: |
          cd dist/npm/traceyard && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/traceyard-*.tgz
          test "$(npx traceyard --version)" = "${{ needs.prepare.outputs.version }}"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" "$RUNNER_TEMP/smoke/node_modules/.bin/traceyard"
      - name: Publish to npm with provenance
        if: env.PUBLISH == 'true'
        working-directory: dist/npm/traceyard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the NPM_TOKEN repository Actions secret (an npm automation or granular publish token)."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --provenance --access public
      - name: Publish to GitHub Packages
        if: env.PUBLISH == 'true'
        working-directory: dist/npm/fysaio-traceyard
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: traceyard
            dockerfile: selfhost/Dockerfile
            title: Traceyard
            description: Self-hosted Traceyard with SQLite storage.
          - image: traceyard-runner
            dockerfile: runner/Dockerfile
            title: Traceyard runner
            description: Isolated runner that executes Traceyard checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.major != '0' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        if: env.PUBLISH == 'true'
      - name: Sign the image with cosign (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the signature
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-identity "https://github.com/${{ github.workflow_ref }}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

  verify:
    name: Verify published artifacts
    needs: [prepare, npm, images]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [traceyard, traceyard-runner]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify npm package availability
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm view "traceyard@$VERSION" version --registry=https://registry.npmjs.org/
      - name: Verify GitHub Packages availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          userconfig="$RUNNER_TEMP/github-packages.npmrc"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$userconfig"
          NPM_CONFIG_USERCONFIG="$userconfig" npm view "@fysaio/traceyard@$VERSION" version --registry=https://npm.pkg.github.com/
      - name: Verify GHCR image is public and exposes an immutable digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -o pipefail
          output=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1) || {
            echo "::error::Unable to fetch $IMAGE:$VERSION without credentials. Make the GHCR package public and retry the release verification."
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          digest=$(printf '%s\n' "$output" | awk '/^Digest:/ {print $2; exit}')
          if [ -z "$digest" ]; then
            echo "::error::No immutable digest was returned for $IMAGE:$VERSION."
            exit 1
          fi
          echo "Verified $IMAGE:$VERSION at $digest"

  release:
    needs: [prepare, npm, images, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          - npm: \`npx traceyard@$VERSION\` ([npm](https://www.npmjs.com/package/traceyard/v/$VERSION))
          - App: \`docker pull ghcr.io/${{ github.repository_owner }}/traceyard:$VERSION\`
          - Runner: \`docker pull ghcr.io/${{ github.repository_owner }}/traceyard-runner:$VERSION\`

          Images are signed with cosign. Verify with:

          \`\`\`
          cosign verify ghcr.io/${{ github.repository_owner }}/traceyard:$VERSION \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Move the major tag for the action
        if: needs.prepare.outputs.major != '0'
        env:
          MAJOR: v${{ needs.prepare.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
