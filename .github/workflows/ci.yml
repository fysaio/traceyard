name: Traceyard checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Reproduce local operator environment
        run: node scripts/seed-ci-operator-env.mjs
      - name: Unit and Worker integration tests
        id: tests
        run: |
          mkdir -p "$RUNNER_TEMP/traceyard-junit"
          npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/traceyard-junit/unit.xml"
          npm run test:integration -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/traceyard-junit/integration.xml"
      - name: Publish test evidence
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        uses: ./runner/test-evidence
        with:
          reports: ${{ runner.temp }}/traceyard-junit
          tested-sha: ${{ github.sha }}
          lane: linux-node22
          test-outcome: ${{ steps.tests.outcome }}
          token: ${{ github.token }}
      - name: Verify test evidence and GitHub history matching
        run: node --test runner/test-evidence/evidence.test.mjs
      - name: Verify the packaged Pytest runner
        run: |
          npm ci --prefix runner/package --omit=dev --ignore-scripts --no-audit --no-fund
          node runner/prepare.mjs
          node scripts/verify-pytest-runner.mjs runner/package/agent/cli.mjs
      - name: Reproduce investigation cost fixture
        run: node scripts/bench-investigation.mjs
      - name: Isolated recorded replay acceptance
        run: node scripts/verify-isolated-replay.mjs
      - name: Production build and TypeScript
        run: npm run build
      - name: Managed deployment configuration build
        run: npm run build:managed
      - name: Lint
        run: npm run lint

  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Retain browser E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-e2e-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  runner-image:
    name: Packaged runner smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the managed runner image
        run: docker build --file runner/Dockerfile --tag traceyard-runner:ci .
      - name: Check actual runner processes without external network
        run: >-
          docker run --rm --network none --user root --entrypoint node
          --mount "type=bind,source=${{ github.workspace }}/scripts/verify-runner-image.mjs,target=/tmp/verify-runner-image.mjs,readonly"
          traceyard-runner:ci /tmp/verify-runner-image.mjs
      - name: Check replay bootstrap cannot run installation hooks
        run: >-
          docker run --rm --network none --entrypoint node
          --mount "type=bind,source=${{ github.workspace }}/scripts/verify-replay-bootstrap.mjs,target=/tmp/verify-replay-bootstrap.mjs,readonly"
          traceyard-runner:ci /tmp/verify-replay-bootstrap.mjs
      - name: Export the tested image for deployment
        run: |
          docker save --output runner-image.tar traceyard-runner:ci
          sha256sum runner-image.tar > runner-image.sha256
          git rev-parse HEAD > source-revision.txt
      - name: Retain the tested image for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceyard-runner-image
          path: |
            runner-image.tar
            runner-image.sha256
            source-revision.txt
          retention-days: 1
          if-no-files-found: error

  self-hosted:
    name: Self-hosted image and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack the npm package and run it from a clean install
        run: |
          node scripts/pack-cli.mjs
          (cd dist/npm/traceyard && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/traceyard-*.tgz
          test "$(npx traceyard --version)" = "$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")"
          node "$GITHUB_WORKSPACE/scripts/smoke-mcp.mjs" "$RUNNER_TEMP/smoke/node_modules/.bin/traceyard"
      - name: Build the self-hosted image
        run: docker build --file selfhost/Dockerfile --build-arg REVISION=${{ github.sha }} --tag ghcr.io/fysaio/traceyard:ci .
      - name: docker compose up with SQLite
        env:
          TRACEYARD_VERSION: ci
        run: |
          docker compose up --detach --no-build
          node scripts/verify-selfhost.mjs http://localhost:8787 ${{ github.sha }}
          docker compose restart
          node scripts/verify-selfhost.mjs http://localhost:8787 ${{ github.sha }} --existing
      - name: Server log
        if: always()
        run: docker compose logs --no-color | tail -200

  investigation-browser:
    name: Investigation browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.investigations.config.ts
      - name: Retain browser journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-journey-evidence
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  issue30-macos-webkit:
    name: Issue #30 keyboard flow on macOS WebKit
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install webkit
      - name: Enable keyboard navigation to all controls
        run: |
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
          test "$(defaults read NSGlobalDomain AppleKeyboardUIMode)" = "2"
      - name: Record macOS and browser runtime versions
        run: |
          sw_vers
          defaults read NSGlobalDomain AppleKeyboardUIMode
          node --version
          npx playwright --version
          npx playwright install --list
      - name: Run the #30 keyboard-flow regression on macOS WebKit
        run: npx playwright test --config playwright.issue30.macos.config.ts
      - name: Retain macOS WebKit test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-30-macos-webkit-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows tests and release build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Reproduce local operator environment
        run: node scripts/seed-ci-operator-env.mjs
      - name: Unit and Worker integration tests on Windows
        run: npm test
      - name: Windows production release build
        run: npm run build

  browser-replay:
    name: Offline browser replay on historical app builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: c2687716cbcca860d187de56ee4e1770b197edac
      FIX_SHA: 8a2c735f003dd63301bd9491fe115f98f99d5435
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build both app revisions
        run: |
          for revision in "$BASE_SHA" "$FIX_SHA"; do
            git worktree add --detach "$RUNNER_TEMP/$revision" "$revision"
            (
              cd "$RUNNER_TEMP/$revision"
              npm ci --no-audit --no-fund
              npm run build
            )
          done
      - name: Build offline replay image
        run: docker build -f runner/browser.Dockerfile -t traceyard-browser .
      - name: Record and replay the expired sign-in journey
        run: >-
          node scripts/verify-browser-workflow.mjs "$BASE_SHA" "$FIX_SHA"
          "$RUNNER_TEMP/$BASE_SHA/dist/client" "$RUNNER_TEMP/$FIX_SHA/dist/client"
          "$PWD/test-results/historical-browser"
      - name: Retain historical browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-browser-replay
          path: test-results/historical-browser/
          retention-days: 7
          if-no-files-found: ignore
