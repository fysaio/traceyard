name: Traceyard checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Reproduce local operator environment
        run: node scripts/seed-ci-operator-env.mjs
      - name: Unit and Worker integration tests
        id: tests
        run: |
          mkdir -p "$RUNNER_TEMP/traceyard-junit"
          npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/traceyard-junit/unit.xml"
          npm run test:integration -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/traceyard-junit/integration.xml"
      - name: Publish test evidence
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        uses: ./runner/test-evidence
        with:
          reports: ${{ runner.temp }}/traceyard-junit
          tested-sha: ${{ github.sha }}
          lane: linux-node22
          test-outcome: ${{ steps.tests.outcome }}
          token: ${{ github.token }}
      - name: Verify test evidence and GitHub history matching
        run: node --test runner/test-evidence/evidence.test.mjs
      - name: Reproduce investigation cost fixture
        run: node scripts/bench-investigation.mjs
      - name: Isolated recorded replay acceptance
        run: node scripts/verify-isolated-replay.mjs
      - name: Production build and TypeScript
        run: npm run build
      - name: Managed deployment configuration build
        run: npm run build:managed
      - name: Lint
        run: npm run lint

  runner-image:
    name: Packaged runner smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the managed runner image
        run: docker build --file runner/Dockerfile --tag traceyard-runner:ci .
      - name: Check actual runner processes without external network
        run: >-
          docker run --rm --network none --entrypoint node
          --mount "type=bind,source=${{ github.workspace }}/scripts/verify-runner-image.mjs,target=/tmp/verify-runner-image.mjs,readonly"
          traceyard-runner:ci /tmp/verify-runner-image.mjs
      - name: Check replay bootstrap cannot run installation hooks
        run: >-
          docker run --rm --network none --entrypoint node
          --mount "type=bind,source=${{ github.workspace }}/scripts/verify-replay-bootstrap.mjs,target=/tmp/verify-replay-bootstrap.mjs,readonly"
          traceyard-runner:ci /tmp/verify-replay-bootstrap.mjs
      - name: Export the tested image for deployment
        run: |
          docker save --output runner-image.tar traceyard-runner:ci
          sha256sum runner-image.tar > runner-image.sha256
          git rev-parse HEAD > source-revision.txt
      - name: Retain the tested image for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: traceyard-runner-image
          path: |
            runner-image.tar
            runner-image.sha256
            source-revision.txt
          retention-days: 1
          if-no-files-found: error

  investigation-browser:
    name: Investigation browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.investigations.config.ts
      - name: Retain browser journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-journey-evidence
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  windows:
    name: Windows tests and release build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Reproduce local operator environment
        run: node scripts/seed-ci-operator-env.mjs
      - name: Unit and Worker integration tests on Windows
        run: npm test
      - name: Windows production release build
        run: npm run build

  browser-replay:
    name: Offline browser replay on historical app builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 2f3815ff34379fc2c40691e44fab3d565843dff8
      FIX_SHA: db61d48b2af4ae2670c2a4258bdeaa64d40246ec
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build both app revisions
        run: |
          for revision in "$BASE_SHA" "$FIX_SHA"; do
            git worktree add --detach "$RUNNER_TEMP/$revision" "$revision"
            (
              cd "$RUNNER_TEMP/$revision"
              npm ci --no-audit --no-fund
              npm run build
            )
          done
      - name: Build offline replay image
        run: docker build -f runner/browser.Dockerfile -t traceyard-browser .
      - name: Record and replay the expired sign-in journey
        run: >-
          node scripts/verify-browser-workflow.mjs "$BASE_SHA" "$FIX_SHA"
          "$RUNNER_TEMP/$BASE_SHA/dist/client" "$RUNNER_TEMP/$FIX_SHA/dist/client"
          "$PWD/test-results/historical-browser"
      - name: Retain historical browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-browser-replay
          path: test-results/historical-browser/
          retention-days: 7
          if-no-files-found: ignore
