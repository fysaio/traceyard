name: Traceyard
run-name: Traceyard ${{ inputs.run_request }}
on:
  workflow_dispatch:
    inputs:
      run_request:
        description: Traceyard check request
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: traceyard-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Traceyard runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fysaio/traceyard
          ref: e388d18620cbd2435ef5f4998353091fd3b635d4
          path: .traceyard-runner
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json
            .traceyard-runner/runner/package/package-lock.json
      - name: Install runner dependencies
        run: npm ci --prefix .traceyard-runner/runner/package --omit=dev --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Prepare trusted runner
        run: node .traceyard-runner/runner/prepare.mjs
      - name: Discover, build and test
        env:
          CI: 'true'
          NPM_CONFIG_PREFER_OFFLINE: 'true'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_FETCH_TIMEOUT: '30000'
          NPM_CONFIG_FETCH_RETRIES: '1'
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_SEND_ERROR_REPORTS: 'false'
          TRACEYARD_ORIGIN: "https://traceyard.pilotsaviour229.workers.dev"
          TRACEYARD_RUN_REQUEST: ${{ inputs.run_request }}
          TRACEYARD_GITHUB_FETCH_TOKEN: ${{ github.token }}
        run: node .traceyard-runner/runner/package/agent/cli.mjs run .
