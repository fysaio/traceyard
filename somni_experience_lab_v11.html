.ui-arrow-diagonal{font-family:Arial,Helvetica,sans-serif;display:inline-flex;align-items:center;justify-content:center;min-width:18px;font-weight:700;font-size:21px;line-height:1;vertical-align:middle}

/* v3 — responsive legibility / no clipping / same product form */
.today-heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:38px}
.today-heading-row .section-kicker{margin:0;min-width:0}
.today-heading-actions{display:flex;align-items:center;gap:5px;flex:none}
.today-heading-actions .icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center}
.today-heading-actions .icon-btn:hover{border-color:var(--line);background:var(--surface)}
.today-heading-actions .ui-icon{width:23px;height:23px}
.graph-node{height:auto;max-height:none;overflow:visible;gap:5px;justify-content:center;line-height:1.3}
.graph-node .node-title{display:block;white-space:normal;overflow:visible;overflow-wrap:break-word;word-break:normal;-webkit-line-clamp:unset;max-width:100%;line-height:1.25}
.graph-node .node-meta{display:block;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;word-break:normal;max-width:100%;line-height:1.24}
.graph-node.cluster-node{height:auto;min-height:84px}
.graph-node.item-node{height:auto;min-height:85px}
.graph-node.focus-center{height:auto;min-height:90px}
.graph-node.focus-related{height:auto;min-height:85px}
.map-top>div:first-child{min-width:0;flex:1}
.map-breadcrumb{min-width:0;max-width:100%}
.map-breadcrumb button{white-space:nowrap}
.map-top h1{overflow-wrap:normal;word-break:normal;max-width:100%}
.map-controls{flex:none}
.map-controls .btn{white-space:nowrap}
.sidebar-header,.sidebar-body{user-select:none}
@media(max-width:720px){
 .today-head{margin-bottom:24px}
 .today-heading-row{margin-bottom:17px}
 .today-heading-actions .icon-btn{width:43px;height:43px}
 .map-top{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:0 3px;margin-bottom:16px}
 .map-top>div:first-child{width:100%;min-width:0}
 .map-breadcrumb{margin-bottom:9px;font-size:13px}
 .map-top h1{font-size:clamp(23px,6.1vw,29px);line-height:1.17;letter-spacing:-.035em;font-weight:770;width:100%;margin:0}
 .map-top .map-heading-sub{font-size:14px;line-height:1.4;margin-top:6px}
 .map-controls{align-self:flex-end;justify-content:flex-end;flex-wrap:wrap;max-width:100%;gap:6px}
 .map-controls .btn{min-height:36px;padding:0 12px;font-size:13px}
 .graph-frame.level-overview{height:620px}
 .graph-frame.level-cluster{height:650px}
 .graph-frame.level-focus{height:640px}
 .graph-node{padding:12px 10px;gap:5px;border-radius:12px;min-height:0;max-height:none}
 .graph-node.cluster-node{width:clamp(115px,40%,150px);min-height:85px;height:auto}
 .graph-node.item-node{width:clamp(120px,39%,150px);min-height:86px;height:auto}
 .graph-node.focus-center{width:clamp(143px,46%,185px);min-height:91px;height:auto}
 .graph-node.focus-related{width:clamp(116px,38%,147px);min-height:84px;height:auto}
 .graph-node .node-title{font-size:13px;line-height:1.24;font-weight:700;letter-spacing:-.017em}
 .graph-node.cluster-node .node-title{font-size:14px}
 .graph-node.focus-center .node-title{font-size:14px}
 .graph-node .node-meta{font-size:11px;line-height:1.22}
 .graph-frame .graph-info{font-size:11px;left:15px;top:13px}
 .graph-frame .graph-count{font-size:11px;right:12px;bottom:10px}
 .map-note{font-size:13px;line-height:1.48}
 .sidebar .sidebar-label:first-child{font-size:11px}
}
@media(max-width:380px){
 .map-top h1{font-size:clamp(22px,6.6vw,25px)}
 .graph-node.cluster-node{width:clamp(114px,40%,144px)}
 .graph-node.item-node{width:clamp(118px,40%,146px)}
 .graph-node.focus-related{width:clamp(111px,38%,140px)}
 .graph-node .node-title{font-size:12.5px}
 .graph-node.cluster-node .node-title{font-size:13.5px}
 .graph-frame.level-overview{height:620px}
 .graph-frame.level-cluster{height:670px}
 .graph-frame.level-focus{height:675px}
}


.page-back{display:inline-flex;align-items:center;gap:9px;color:var(--muted);padding:10px 0;margin:0 0 17px;font-size:14px;font-weight:620}.page-back:hover{color:var(--text)}.page-back .ui-icon{width:20px;height:20px}

.cap-map-node:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.cap-map-node:active{scale:.98}
.cap-map-node.wing{width:43%;min-height:105px;padding:12px 11px}
.cap-map-node.origin,.cap-map-node.destination{width:74%;min-height:88px}
.cap-map-node.selected{background:var(--strong);color:var(--inverse);border-color:var(--strong);box-shadow:0 11px 30px #0002}
.cap-map-node.connected:not(.selected){border-color:var(--muted)}
.cap-map-node.deemphasized{opacity:.65}
.cap-node-tag{font-size:10px;line-height:1.2;letter-spacing:.075em;font-weight:800;text-transform:uppercase;color:var(--subtle)}
.cap-map-node.selected .cap-node-tag{color:var(--inverse);opacity:.64}
.cap-node-label{font-size:15px;line-height:1.27;font-weight:760;letter-spacing:-.025em}
.cap-map-node.wing .cap-node-label{font-size:13.7px}
.cap-node-caption{font-size:11px;line-height:1.25;color:var(--muted)}
.cap-map-node.selected .cap-node-caption{color:var(--inverse);opacity:.7}
.cap-map-locate{position:absolute;right:10px;bottom:10px;min-width:43px;height:43px;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;background:var(--strong);color:var(--inverse);z-index:3;box-shadow:0 4px 16px #0003;padding:0 12px;font-size:12px;font-weight:750}
.cap-map-locate .ui-icon{width:18px;height:18px;filter:var(--inverse-icon-filter,none)}
.cap-map-legend{display:flex;justify-content:flex-start;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 1px 3px}
.cap-map-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cap-line{display:inline-block;width:19px;height:0;border-top:2px solid var(--muted)}
.cap-line.bright{border-color:var(--text);border-top-width:3px}
.cap-line.dotted{border-top-style:dashed}
.cap-legend-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}
.cap-map-crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:0 0 12px;min-width:0}
.cap-map-crumb button{min-height:34px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-map-crumb .ui-icon{width:14px;height:14px}
.cap-jump-note{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;margin:0 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.cap-jump-note button{color:var(--text);font-weight:750;text-decoration:underline;text-underline-offset:3px}
.cap-map-support{margin-top:16px;display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:12px;line-height:1.55}
.cap-map-support .ui-icon{width:19px;height:19px;flex:none}
.cap-scrim{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:42}
.cap-detail-sheet{position:fixed;bottom:0;left:0;right:0;max-height:min(75dvh,730px);overflow-y:auto;overscroll-behavior:contain;padding:9px max(19px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:var(--bg);border:1px solid var(--line);border-bottom:0;z-index:43;box-shadow:0 -18px 55px #0005;animation:cap-up .22s cubic-bezier(.16,.82,.3,1)}
.cap-sheet-wrap{width:min(100%,560px);margin:0 auto}
.cap-grabber{height:4px;width:42px;background:var(--line);border-radius:5px;margin:3px auto 17px}
.cap-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
.cap-sheet-head h2{font-size:clamp(24px,7vw,31px);line-height:1.18;letter-spacing:-.04em;margin:6px 0 6px}
.cap-sheet-sub{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0 18px}
.cap-sheet-close{height:40px;width:40px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;flex:none}
.cap-sheet-close .ui-icon{width:20px;height:20px}
.cap-detail-section{border-top:1px solid var(--line);padding:15px 0;display:grid;gap:7px}
.cap-detail-section h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.075em;font-weight:750}
.cap-detail-section p{font-size:14px;line-height:1.6;color:var(--text)}
.cap-sheet-action{width:100%;background:var(--strong);color:var(--inverse);border-radius:13px;min-height:47px;font-size:14px;font-weight:800;margin:5px 0 0}
.cap-sheet-soft-action{width:100%;border:1px solid var(--line);border-radius:13px;min-height:45px;font-size:14px;font-weight:700;margin:8px 0 0}
.cap-search-modal{position:fixed;inset:0;z-index:46;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 17px max(15px,env(safe-area-inset-bottom));animation:cap-in .16s ease}
.cap-search-content{width:min(100%,560px);margin:0 auto;min-height:0;display:flex;flex-direction:column;flex:1}
.cap-search-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.cap-search-head button{height:42px;min-width:34px;display:grid;place-items:center}
.cap-search-head h2{font-size:23px;letter-spacing:-.035em}
.cap-search-input-wrap{border:1px solid var(--line);border-radius:15px;padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:54px}
.cap-search-input-wrap .ui-icon{width:22px;height:22px}
.cap-search-input{width:100%;flex:1;min-width:0;border:0;background:transparent;color:var(--text);outline:none;font:inherit;font-size:16px}
.cap-search-results{overflow:auto;flex:1;min-height:0;padding-bottom:15px}
.cap-search-section{margin:22px 0 9px;font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.cap-search-row{width:100%;display:flex;align-items:center;gap:12px;padding:13px 5px;text-align:left;min-height:60px;border-bottom:1px solid var(--line-soft);color:var(--text)}
.cap-search-row .ui-icon{width:20px;height:20px;flex:none;opacity:.7}
.cap-search-row-main{flex:1;min-width:0}
.cap-search-row strong{font-weight:750;line-height:1.35;display:block;font-size:14px}
.cap-search-row small{font-size:11px;color:var(--muted);display:block;line-height:1.5;margin-top:3px}
.cap-search-row:hover{background:var(--surface)}
.cap-search-empty{padding:25px 0;color:var(--muted);font-size:14px;line-height:1.6}
.cap-chat-locator{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;max-width:390px;text-align:left;margin:12px 0 5px;background:var(--surface)}
.cap-chat-locator .ui-icon{width:19px;height:19px;flex:none}
.cap-chat-locator strong{font-size:13px;display:block}
.cap-chat-locator small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.cap-chat-locator .ui-arrow-diagonal{font-size:18px}
.cap-lab-buttons{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 20px}
.cap-lab-buttons button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:13px;font-weight:750}
.cap-lab-buttons button.active{background:var(--strong);color:var(--inverse)}
.cap-lab-lede{font-size:14px;color:var(--muted);line-height:1.6}
@keyframes cap-up{from{transform:translateY(18px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes cap-in{from{opacity:.6}to{opacity:1}}
@media(max-width:390px){.cap-page{padding-left:14px;padding-right:14px}.cap-map-node{padding:12px 13px}.cap-map-node.wing{padding:11px 10px}.cap-map-node.wing .cap-node-label{font-size:13.2px}.cap-map-legend{gap:10px}}
@media(max-width:340px){.cap-map-node.wing{width:44%;min-height:110px}.cap-map-node.wing .cap-node-label{font-size:12.7px}.cap-node-tag{font-size:9.4px}.cap-node-label{font-size:14.1px}.cap-map-viewport{height:auto;min-height:0}}
@media(min-width:720px){.cap-page{padding-top:28px}.cap-map-viewport{height:auto;min-height:0}.cap-detail-sheet{max-width:600px;left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}.cap-search-modal{padding-top:45px}}
@media(prefers-reduced-motion:reduce){.cap-map-node,.cap-routes path,.cap-detail-sheet,.cap-search-modal{transition:none;animation:none}.cap-map-viewport{scroll-behavior:auto}}

.cap-head-tools{display:flex;align-items:center;gap:8px}.cap-map-node.deemphasized{opacity:1}.cap-map-node.deemphasized .cap-node-tag{color:var(--muted)}

/* v7: one scroll owner, no scroll-within-scroll on the mobile Map. */

.cap-work-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0}

.cap-work-row p{font-size:13px;line-height:1.48;color:var(--muted)}

.cap-sheet-action{margin:4px 0 0}

 const sheet=t.sheet&&nowNode?`<div class="adjust-options">${t.preview?`<div class="today-preview"><strong>Smaller version</strong><p class="fine">Instead of "${esc(nowNode.title)}", start with "${esc(firstItem||nowNode.title)}". The rest stays in the plan.</p><div class="actions"><button class="btn primary smallbtn" data-action="today-small-confirm">Use smaller step</button><button class="btn smallbtn" data-action="today-small-cancel">Cancel</button></div></div>`:`<button class="btn smallbtn" data-action="today-small-preview">Make smaller</button><button class="btn smallbtn" data-action="today-later" data-value="later">Later today</button><button class="btn smallbtn" data-action="today-later" data-value="tomorrow">Tomorrow</button><button class="btn smallbtn" data-action="today-help">Get help</button>`}</div>`:'';
 const nowCard=nowNode?`<article class="soft-card now-card"><div class="section-kicker">${begun?'In progress':'Right now'}</div><h2>${esc(nowTitle)}</h2><p class="project">${esc(v.name)}</p><div class="actions"><button class="btn primary" data-action="today-start">${begun?'Resume':'Start'} ${I('arrow-up-right')}</button><button class="btn" data-action="today-adjust" aria-expanded="${!!t.sheet}">Adjust</button></div>${sheet}</article>`:`<article class="soft-card now-card"><div class="section-kicker">Right now</div><h2>${v.allDone?'Every planned stage is complete':'Nothing else is ready'}</h2><p class="project">${esc(v.name)}</p></article>`;
 const upCard=up?`<article class="light-card next-card"><div class="section-kicker">Up next · ${esc(upLabel)}</div><h3>${esc(up.title)}</h3>${others.length?`<button class="later-link" data-action="toggle-later">${state.showLater?'Hide other Spaces':others.length+' more in other Spaces'}${I(state.showLater?'caret-up':'caret-right')}</button>${state.showLater?`<div class="later-lines">${others.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}`:''}</article>`:'';
 const note=t.notice?`<p class="quiet-note" role="status">${esc(t.notice)} <button class="inline-undo" data-action="today-undo">Undo</button></p>`:'';
 return `<section class="page today-shell"><div class="today-head"><div class="today-heading-row"><div class="section-kicker">${esc(dateLabel)}</div><div class="today-heading-actions"><button class="icon-btn" data-nav="notifications" aria-label="Notifications" title="Notifications">${I('bell')}${notifEvents().some(e=>!state.readIds[e.id])?'<span class="notif-dot" aria-hidden="true"></span>':''}</button><button class="icon-btn" data-nav="settings" aria-label="Settings" title="Settings">${I('gear')}</button></div></div><h1>Today</h1></div><div class="today-cards">${nowCard}${upCard}</div>${note}</section>`;}

function detailData(){if(state.space==='onboard'&&state.ob?.nodeInfo?.[state.node])return state.ob.nodeInfo[state.node];const sp=datasets[state.space],n=itemOf(sp,state.node)||itemOf(sp,sp.focus);const fallback={kind:'Project item',status:n.status||'Open',summary:`${n.label} is part of the ${clusterOf(sp,n.group)?.name||'project'} work. No result has been established for it in this illustrative example.`,limit:'The relevant evidence or project context is not yet available.',next:'Clarify what would establish a useful conclusion for this part of the project.'};const f={...fallback,...(meta[state.node]||{})};if(state.scenario==='evidence'&&state.space==='living'){
 if(state.node==='e1')return {...f,status:'New finding',summary:'A preliminary test suggests lower CO₂ uptake than the earlier working estimate. The result is not yet verified.',limit:'Methodology, baseline and repeatability need checking.',next:'Review the experiment and repeat the measurement under controlled conditions.',change:{before:'Uptake was represented by an early estimate.',after:'A preliminary measurement challenges that estimate.'}};

 }

 if(state.scenario==='return'&&state.space==='living'&&state.node==='e4')return {...f,status:'Where you left off',summary:'The project still has one major scientific unknown: a reliable comparison between CO₂ uptake and the emissions from operation. No verified result has been recorded.',next:'Revisit the most recent measurement assumptions before proceeding.'};

}

tiny">Next useful work</span><p>${esc(f.next)}</p></div>`}</aside>`;}
function renderOnboardMap(){const o=state.ob,w=o.work||obFirstWork(),known=obKnown(),cfg=obCfg();const active=state.node&&['u0','u1','w0','w1','v0'].includes(state.node)?state.node:'u0';const attrs={u0:{label:cfg.name,caption:'Your starting ambition',title:'Your ambition',copy:known.find(f=>f.id==='goal')?.text||cfg.goal},u1:{label:'What Somni knows',caption:'Confirmed context',title:'Understanding so far',copy:known.map(f=>f.label+': '+f.text).join(' • ')},w0:{label:'First result',caption:'Prepared work',title:w.title,copy:w.intro},v0:{label:'What remains unknown',caption:'Evidence / uncertainty',title:'What we still need to learn',copy:w.status+' · '+(w.points[1]?.body||w.insight)},w1:{label:'Continue this work',caption:'Ready on Today',title:w.now,copy:'The next meaningful action builds directly on the first prepared result. '+w.next}};const one=id=>{const n=attrs[id];return `<button type="button" class="onboard-tree-card ${active===id?'selected':''} ${id==='u0'?'origin':''}" data-action="ob-map-select" data-node="${id}" aria-pressed="${active===id}"><span class="tree-card-kicker">${esc(n.caption)}</span><strong>${esc(n.label)}</strong><span class="tree-card-arrow">${I('arrow-up-right')}</span></button>`;};const item=attrs[active];return `<section class="page onboard-map-page"><div class="onboard-map-header"><button class="page-back" data-nav="today">${I('arrow-left')} Today</button><div class="section-kicker">YOUR SPACE · ${esc(cfg.name)}</div><h1>${esc(cfg.name)}</h1><p>Start here. See what Somni understands, what it prepared, and where your work continues.</p></div><div class="onboard-map-frame"><div class="section-kicker">STARTING MAP</div><div class="onboard-map-tree"><div class="tree-root">${one('u0')}</div><div class="tree-stem" aria-hidden="true"></div><div class="tree-branches"><div>${one('u1')}</div><div>${one('w0')}</div><div>${one('v0')}</div></div><div class="tree-stem" aria-hidden="true"></div><div class="tree-end">${one('w1')}</div></div></div><div function renderMap(){if(state.space==='onboard')return renderOnboardMap();const sp=datasets[state.space],n=itemOf(sp,state.node)||itemOf(sp,sp.focus),current=state.level==='overview'?'Whole Space':state.level==='cluster'?clusterOf(sp,state.cluster)?.name:n?.label;let count=sp.clusters.reduce((sum,c)=>sum+c.items.length,0);return `<section class="page map-page"><div class="map-top"><div><div class="map-breadcrumb"><button style="color:var(--muted);padding:0" data-nav="spaces">Spaces</button></div><h1>${esc(sp.name)}</h1><div class="map-heading-sub">${state.level==='overview'?sp.goal:current}</div></div><div class="map-controls">${state.level!=='overview'?`<button class="btn smallbtn" data-action="map-back">${I('arrow-left')} Back</button><button class="btn smallbtn" data-action="map-overview">Whole Map</button>`:`<span class="pill">${count} items · ${sp.edges.length} links</span>`}</div></div><div class="map-structure ${state.level==='focus'?'has-detail':''}"><div class="map-plane"><div class="graph-frame level-${state.level}" id="graph-frame"><canvas class="graph-canvas" id="graph-canvas"></canvas><span class="graph-info">${state.level==='overview'?'CONNECTED CLUSTERS':state.level==='cluster'?'INSIDE '+(clusterOf(sp,state.cluster)?.name||'').toUpperCase():'CURRENT FOCUS'}</span><span class="graph-count">${state.level==='overview'?'Tap a cluster':state.level==='cluster'?'Tap a node':'Tap a connected point'}</span><div id="graph-nodes"></div></div><div class="map-note">${state.level==='overview'?'Clusters reflect areas of the problem. Connections can cross between them.':state.level==='cluster'?'Information is grouped, not isolated: dependencies can reach outside this cluster.':'Only the most relevant connections are visible. The full network remains intact.'}</div></div>${state.level==='focus'?renderInspector():''}</div></section>`;}
function renderConversation(){if(state.ob?.completed&&state.ob.active)return renderOnboardConversation();const mapped=state.scenario==='evidence',budget=state.scenario==='budget';const reason=mapped?'A preliminary test suggests CO₂ uptake is below the earlier estimate. We need to check the evidence before revising the environmental claim.':budget?'A lower budget could change the available equipment choices. No alternative has been selected yet.':'The camera may no longer fit your budget. We should compare feasible sensing approaches before committing to the prototype.';const preview=mapped?{title:'CO₂ uptake estimate challenged',description:'New preliminary evidence affects the net-benefit assessment. A repeat test is still needed.',node:'e1'}:budget?{title:'Budget change proposed',description:'A lower equipment budget may affect component options and the prototype.',node:'r0'}:{title:'Camera selection needs review',description:'The revised budget affects sensing options. Compare alternatives before choosing.',node:'s1'};return `<section class="page chat-page"><div class="chat-heading"><div class="row"><button class="icon-btn" data-action="chat-back" aria-label="Back">${I('arrow-left')}</button><div style="flex:1"><h2>Conversation</h2><p class="fine" style="margin-top:5px">somni.</p></div></div></div><div class="chat-timeline"><div class="context-strip"><div class="context-part"><div class="context-title">NOW</div><div class="context-detail">Camera decision</div></div><div class="context-part"><div class="context-title">NEXT · 2 PM</div><div class="context-detail">Budget review</div></div></div><div class="message-row user"><div class="bubble">${mapped?'The pilot result is lower than what we expected. What does that change?':budget?'Our budget dropped. What is affected?':'That camera is too expensive now. Can we rethink our options?'}</div></div><div class="message-row assistant"><div class="assistant-body"><div class="assistant-label">somni.</div><p>${esc(reason)}<  const audience=get('audience');const evidence=(o.answers.evidence||'').toLowerCase();const clinic=/clinic|customer/i.test(audience);const proof=evidence.includes('demo')?'a working product demonstration':evidence.includes('interview')?'early conversations with clinic staff':evidence.includes('actual users')?'actual users or customers':'an idea that still needs field validation';

function buildObSpace(){const o=state.ob,known=obKnown(),wk=o.work||obFirstWork();const field=id=>known.find(f=>f.id===id)?.text||'';const clusters=[
 {id:'u',name:'Direction',status:'Understood',items:[{id:'u0',label:'Ambition'},{id:'u1',label:'Success criteria'},{id:'u2',label:'Constraints'}]},
 {id:'v',name:o.type==='french'?'Starting point':o.type==='pitch'?'Audience & evidence':'Feasibility',status:'To investigate',items:[{id:'v0',label:o.type==='french'?'Current level':o.type==='pitch'?'Audience':'Main uncertainty'},{id:'v1',label:'Relevant evidence'},{id:'v2',label:'Open questions'}]},
 {id:'w',name:'First work',status:'Prepared',items:[{id:'w0',label:'First useful result'},{id:'w1',label:'Right Now'},{id:'w2',label:'Up Next'}]},

 ];

 is completed.'}};
 clusters.forEach(g=>g.items.forEach(item=>{item.group=g.id;item.status=nodeInfo[item.id].status}));
 datasets.onboard={id:'onboard',name:obCfg().name,goal:field('goal'),focus:'u0',clusters,edges:[['u0','u1'],['u1','u2'],['u0','v0'],['v0','v1'],['v1','v2'],['u1','w0'],['v2','w0'],['w0','w1'],['w1','w2'],['w0','z0'],['z0','z1'],['z1','z2'],['w2','z1'],['u2','w0']]};
 o.nodeInfo=nodeInfo;

function obSetType(type){state.ob=makeObState(type);state.screen='onboarding';state.sidebarOpen=false;render();}
function obChoose(opt){const o=state.ob,q=obNextQuestion();if(!q)return;if(q.type==='single'){o.chosen=[opt];render({keepScroll:true});return;}o.chosen=o.chosen.includes(opt)?o.chosen.filter(x=>x!==opt):[...o.chosen,opt];render({keepScroll:true});}

 if(o.type==='french')return 'We can begin speaking immediately and adjust based on your actual response.';

function obScrollToActive(){requestAnimationFrame(()=>{const el=document.querySelector('[data-ob-active]');if(!el)return;const y=el.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-17;scroller.scrollTop=Math.max(0,y);});}
function obSend(){const o=state.ob,t=o.draft.trim();if(o.phase==='intent'){
 if(!t)return;o.original=t;o.history=[{role:'user',text:t}];o.draft='';o.phase=obQuestions().length?'conversation':'summary';o.questionIndex=0;render({keepScroll:true});obScrollToActive();return;
}
if(o.phase==='conversation'){
 const q=obNextQuestion();if(!q)return;
 let val;if(q.type==='rank'){val=o.rank.map(ix=>q.options[ix]);if(t)val.push(t);if(!val.length)return;}
 else if(q.type==='multi'){val=[...o.chosen];if(t)val.push(t);if(!val.length)return;}
 else {val=t?(o.chosen.length?o.chosen[0]+' — '+t:t):o.chosen[0];if(!val)return;}
 o.answers[q.key]=val;
 o.history.push({role:'somni',text:q.title},{role:'user',text:Array.isArray(val)?val.map((v,i)=>q.type==='rank'?(i+1)+'. '+v:v).join(' · '):val});
 o.draft='';o.chosen=[];o.questionIndex+=1;if(!obNextQuestion())o.phase='summary';render({keepScroll:true});obScrollToActive();return;

if(o.phase==='summary'){
 if(!t)return;

 if(target==='auto'){

t type="checkbox" id="ds-check" ${c.check?'checked':''}/><span>Allow relevant suggestions</span></label>`)}${dsCard('Sliders & segmented choices',`<label for="ds-range" style="display:flex;justify-content:space-between">Typical session <strong id="ds-slider-value">${c.slider} minutes</strong></label><input type="range" id="ds-range" class="ds-range" min="10" max="90" step="10" value="${c.slider}"/><div class="studio-chips" style="margin-top:12px">${['morning','afternoon','varies'].map(x=>stChip(x[0].toUpperCase()+x.slice(1),'ds-segment',x,c.segment===x)).join('')}</div>`,`Sliders update locally, without model calls.`)}${dsCard('Tactile rank ordering',`<div id="ds-rank" class="studio-rank" role="list" aria-label="Reorder design sample">${c.sort.map((x,i)=>`<div role="listitem" tabindex="0" data-ds-rank="${i}" class="studio-rank-row"><span class="studio-rank-number">${i+1}</span><span class="studio-rank-text">${esc(x)}</span><button class="studio-grip" data-ds-grip="${i}" aria-label="Drag to reorder ${esc(x)}">${I('list')}</button></div>`).join('')}</div><p class="studio-ranking-note">Touch-drag or Ctrl + ↑ / ↓. No visible up/down arrows.</p>`,`The order updates, but doesn't silently submit.`)}</div></section>

function studioClick(a,el){const value=el.dataset.value||'';switch(a){
case 'studio-mode':studioReset(value);break;case 'studio-reset':studioReset();break;
case 'studio-level':studio.level=value;studio.step=1;render({keepScroll:true});studioScrollEnd();break;
case 'studio-french-reply':studio.reply=value;studio.step=2;render({keepScroll:true});studioScrollEnd();break;
case 'studio-practice-choice':{const N=studioFrenchItems.length,ci=Number(value);if(studio.practiceIndex<N){const ix=studio.practiceIndex,item=studioFrenchItems[ix];if(!item||item.kind==='type')break;studio.practiceAnswers.push({index:ix,answer:item.answers[ci],correct:ci===item.correct});studio.practiceIndex++;frAdvance();}else if(studio.retest&&studio.retestIndex<studio.retest.length){const ix=studio.retest[studio.retestIndex],v=studioFrenchItems[ix].variant;studio.retestAnswers.push({index:ix,answer:v.answers[ci],correct:ci===v.correct});studio.retestIndex++;frAdvance();}render({keepScroll:true});studioScrollEnd();break;}
case 'studio-practice-retry':studio.practiceIndex=0;studio.practiceAnswers=[];studio.retest=null;studio.retestIndex=0;studio.retestAnswers=[];render({keepScroll:true});studioScrollEnd();break;
case 'studio-audience':studio.audience=value;studio.step=1;render({keepScroll:true});studioScrollEnd();break;
case 'studio-pick':studio.picks=studio.picks.includes(value)?studio.picks.filter(x=>x!==value):[...studio.picks,value];render({keepScroll:true});break;
case 'studio-refine':if(studio.picks.length){studio.focus=[...studio.picks];studio.savedPitch='';studio.step=2;studio.editing=false;render({keepScroll:true});studioScrollEnd()}break;
case 'studio-edit-pitch':studio.editing=true;render({keepScroll:true});break;
case 'studio-cancel-edit':studio.editing=false;render({keepScroll:true});break;
case 'studio-save-pitch':{const before=studioDraft(),after=(document.querySelector('#studio-pitch-editor')?.value||before).trim()||before;if(after!==before){studio.pitchHistory.push(studio.savedPitch);const bw=before.split(/\s+/),aw=after.split(/\s+/),rem=bw.filter(w=>!aw.includes(w)).length,add=aw.filter(w=>!bw.includes(w)).length;studio.pitchNote='Saved. About '+add+' new and '+rem+' removed words.';logEvent('Edited pitch draft',null,'pitch');}else studio.pitchNote='No changes to save.';studio.savedPitch=after;studio.editing=false;render({keepScroll:true});break;}
 case 'studio-pitch-undo':{if(studio.pitchHistory.length){studio.savedPitch=studio.pitchHistory.pop();studio.pitchNote='Last edit undone.';}render({keepScroll:true});break;}
 case 'studio-pitch-tool':studio.pitchTool=studio.pitchTool===value?null:value;render({keepScroll:true});break;
 case 'studio-direction-change':studio.step=1;render({keepScroll:true});studioScrollEnd();break;
case 'studio-direction':studio.route=value;studio.step=2;state.livingRoute=value;logEvent('Living Installation direction: '+value,null,'living');render({keepScroll:true});studioScrollEnd();break;
case 'studio-rank-continue':studio.step=1;render({keepScroll:true});studioScrollEnd();break;
case 'studio-extras':studio.extras=!studio.extras;render({keepScroll:true});break;
case 'studio-send':studioSend();break;
case 'studio-map':state.space=studio.type==='simple'?'french':studio.type==='medium'?'pitch':'living';capJump(el.dataset.node||'discover-0',state.screen);break;
}}
function designClick(a,el){const v=el.dataset.value||'';switch(a){case'ds-toast':design.toast=v||'Completed';break;case'ds-clear':design.toast='';break;case'ds-sheet':design.sheet=true;break;case'ds-close-sheet':design.sheet=false;break;case'ds-single':design.single=v;break;case'ds-multi':design.multi=design.multi.includes(v)?design.multi.filter(x=>x!==v):[...design.multi,v];break;case'ds-segment':design.segment=v;break;case'ds-toggle':design.toggle=!design.toggle;break;case'ds-composer-send':{const n=document.querySelector('#ds-composer-text')?.value.trim();design.toast=n?`Example sent: ${n}`:'Type a message first';break;} }render({keepScroll:true});}

function screenHTML(){switch(state.screen){case'today':return renderToday();case'spaces':return renderSpaces();case'map':return renderCapabilityMap();case'map-stress':return renderMapScaleLab();case'conversation':return renderCapabilityChat();case'notifications':return renderNotifications();case'yesterday':return renderYesterday();case'you':return renderYou();case'settings':return renderSettings();case'availability':return renderAvailability();case'connections':return renderConnections();case'privacy':return renderPrivacy();case'account':return renderAccount();case'onboarding':return renderOnboarding();case'capability':return renderCapability();case'capability-chat':return renderStudio();case'cap-simple':return renderStudio();case'cap-medium':return renderStudio();case'cap-complex':return renderStudio();case'design-system':return renderDesignSystem();case'onboarding-result':return state.ob?.completed?renderOnboardingResult():renderCapability();case'philosophy':return renderPhilosophy();default:return renderToday();}}
function composerNeeded(){return ['today','spaces','map','conversation','onboarding'].includes(state.screen);}
function renderComposer(){if(state.screen==='onboarding')return renderObComposer();if(['cap-simple','cap-medium','cap-complex','capability-chat'].includes(state.screen)){
 $('#dock').classList.remove('hidden');$('#mobile-tabs').classList.add('hidden');
 $('#dock').innerHTML=`${studio.extras?`<div class="studio-attach-actions"><label class="studio-attach-choice" for="studio-file-input">${I('plus')} Add a file</label><input id="studio-file-input" type="file" accept="image/*,.pdf,.txt,.doc,.docx,.csv" hidden /></div>`:''}<div class="composer studio-product-composer"><button class="add" data-action="studio-extras" title="Add context" aria-label="Add context"><span class="composer-sign">+</span></button><textarea id="studio-composer" rows="1" aria-label="Message to somni." placeholder="What's on your mind?">${esc(studio.draft)}</textarea><button class="send" data-action="studio-send" aria-label="Send message" title="Send message" ${studio.draft.trim()?'':'disabled'}><span class="composer-sign arrow-up">↑</span></button></div>`;
 const ta=$('#studio-composer');if(ta){ta.style.height='28px';ta.style.height=Math.min(160,Math.max(28,ta.scrollHeight))+'px';}return;
 }if(!composerNeeded()){  $('#dock').classList.add('hidden');$('#mobile-tabs').classList.add('hidden');return;}
 $('#dock').classList.remove('hidden');$('#mobile-tabs').classList.remove('hidden');
 $('#dock').innerHTML=`${state.attach?`<div class="attach-chip"><span>${esc(state.attach.name)}</span><button data-action="remove-attach" aria-label="Remove attachment">${I('x')}</button></div>`:''}<input id="composer-file" type="file" hidden /><div class="composer ${state.composerValue?'ready':''}" id="composer"><button class="add" data-action="attachment" title="Attach a file" aria-label="Attach a file"><span class="composer-sign">+</span></button><textarea id="composer-text" rows="1" aria-label="Message to somni." placeholder="What's on your mind?">${esc(state.composerValue)}</textarea><button class="send" data-action="send" aria-label="Send message" title="Send message" ${state.composerValue.trim()||state.attach?'':'disabled'}><span class="composer-sign arrow-up">↑</span></button></div>`;
 $('#mobile-tabs').innerHTML=`<button class="mobile-tab ${state.screen==='today'?'active':''}" data-nav="today"><span class="symbol">${I('house')}</span>Today</button><button class="mobile-tab ${['spaces','map'].includes(state.screen)?'active':''}" data-nav="spaces"><span class="symbol">${I('circles-three')}</span>Spaces</button>`;
 const t=$('#composer-text'); t.style.height='23px';t.style.height=Math.min(170,t.scrollHeight)+'px';
}
function render({keepScroll=false}={}){const y=scroller.scrollTop;document.documentElement.setAttribute('data-theme',state.theme);document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#0b0b0c':'#fafafa';PREFS.setItem('somni-preview-theme',state.theme);saveState();$('#app').classList.toggle('cap-chat-live',['cap-simple','cap-medium','cap-complex','capability-chat'].includes(state.screen));$('#sidebar').classList.toggle('collapsed',state.sidebarCollapsed);$('#sidebar').classList.toggle('mobile-open',state.sidebarOpen);$('#scrim').classList.toggle('show',state.sidebarOpen);$('#side-nav').innerHTML=navHTML();$('#screen').innerHTML=screenHTML();renderComposer();if(keepScroll)scroller.scrollTop=y;else scroller.scrollTop=0;requestAnimationFrame(()=>{drawAll();capPostRender();});}
function changeScreen(id){if(id==='onboarding-result')id='today';if(id==='yesterday')id='notifications';if(id==='you'||id==='account')id='settings';if(['cap-simple','cap-medium','cap-complex'].includes(id))enterStudio(id.slice(4));if(id==='map-stress'){const c=capState();Object.assign(c,{depth:'route',stage:'discover',selected:null,sheet:false,search:false,scrollY:0,jumpFrom:null,history:[]});}state.screen=id;state.sidebarOpen=false;state.composerValue='';render();}
function setScenario(id){state.scenario=id;state.undo=false;state.review='pending';state.space='living';state.cluster='e';state.node=id==='budget'?'r0':id==='evidence'?'e1':'e4';state.level=(id==='baseline')?'overview':'focus';state.screen=id==='baseline'?'spaces':id==='return'?'map':'map';state.sidebarOpen=false;render();}
function openSpace(id){state.space=id;const c=capState();Object.assign(c,{depth:'route',stage:'discover',selected:null,sheet:false,search:false,scrollY:0,history:[],jumpFrom:null,openedFrom:'spaces'});state.node=datasets[id].focus;state.cluster=state.node[0];state.level='overview';changeScreen('map');}
function selectGraph(type,id){const sp=datasets[state.space];if(type==='cluster'){state.cluster=id;state.level='cluster';const first=clusterOf(sp,id)?.items[0];state.node=first?.id||sp.focus;}else{state.node=id;state.cluster=itemOf(sp,id)?.group||state.cluster;state.level='focus';}render({keepScroll:true});if(window.innerWidth<=930&&state.level==='focus'){setTimeout(()=>$('#node-inspector')?.scrollIntoView({behavior:'smooth',block:'nearest'}),95);}}
function backMap(){if(state.level==='focus')state.level='cluster';else if(state.level==='cluster')state.level='overview';else return changeScreen('spaces');render({keepScroll:true});}
function sendMessage(){const text=$('#composer-text')?.value.trim()||state.composerValue.trim();if(!text&&!state.attach)return;state.chatMessages.push(text+(state.attach?(text?' ':'')+'[Attached: '+state.attach.name+']':''));state.attach=null;state.composerValue='';state.returnScreen=state.screen==='conversation'?state.returnScreen:state.screen;state.screen='conversation';render();requestAnimationFrame(()=>{const rows=[...document.querySelectorAll('.chat-timeline .message-row.user')];const last=rows[rows.length-1];if(last){scroller.scrollTop+=last.getBoundingClientRect().top-scroller.getBoundingClientRect().top-72;}});}
function spaceView(id){const prev=state.space;state.space=id;try{const pr=capProject(),done=doneSet();const cur=pr.nodes[pr.current];const ready=STAGE_ORDER.filter(x=>!done[x]&&x!==pr.current&&stageReady(x,done)).map(x=>pr.nodes[x]);const after=STAGE_ORDER.find(x=>!done[x]&&x!==pr.current)||null;return {id,name:datasets[id]?.name||pr.name,pr,cur,ready,after:after?pr.nodes[after]:null,allDone:Object.keys(done).length>0&&!nextCurrent(done)};}finally{state.space=prev;}}
function clickHandler(e){const element=e.target.closest('[data-action],[data-nav]');if(!element)return;if((element.dataset.action||'').startsWith('studio-')){studioClick(element.dataset.action,element);return;}if((element.dataset.action||'').startsWith('ds-')){designClick(element.dataset.action,element);return;}if(element.dataset.nav){const route=element.dataset.nav;if(['baseline','evidence','budget','return'].includes(route))setScenario(route);else changeScreen(route);return;}const a=element.dataset.action;
  switch(a){
  case'cap-back':capBack();break;
  case'cap-route-node':capChooseRoute(element.dataset.id);break;
  case'cap-detail-node':capChooseLeaf(element.dataset.id);break;
  case'cap-detail-stage':capChooseLeaf(element.dataset.id);break;
  case'cap-close-sheet':capState().sheet=false;render({keepScroll:true});break;
  case'cap-explore-stage':{const c=capState();c.history.push({...capSnapshot(),sheet:false});c.depth='stage';c.stage=element.dataset.id;c.selected=null;c.sheet=false;c.scrollY=0;render();break;}
  case'cap-locate':{const c=capState();c.history.push(capSnapshot());c.depth='route';c.stage=capProject().current;c.selected=capProject().current;c.sheet=false;c.pendingTarget=capProject().current;c.jumpFrom=null;render();break;}
  case'cap-search':{const c=capState();capSaveScroll();c.search=true;c.sheet=false;c.searchText='';c.showAllRecent=false;render({keepScroll:true});break;}
  case'cap-close-search':capState().search=false;render({keepScroll:true});break;
  case'cap-more-recent':capState().showAllRecent=!capState().showAllRecent;render({keepScroll:true});break;
  case'cap-jump':capJump(element.dataset.id);break;
  case'cap-chat-jump':{if(state.ob?.completed&&state.ob.active)state.space='onboard';else if(!state.cap?.activeNode)state.space=state.scenario==='evidence'||state.scenario==='budget'?'living':'robot';capJump(element.dataset.id,'conversation');break;}
  case'cap-return-source':{const c=capState(),src=c.jumpFrom||'spaces';c.jumpFrom=null;c.sheet=false;changeScreen(src);break;}
  case'cap-prereq':{const c=capState();c.history.push(capSnapshot());const id=element.dataset.id,node=capFindNode(id);if(!node)break;c.selected=id;c.sheet=true;c.depth=node.kind==='stage'?'route':'stage';c.stage=node.stage;c.pendingTarget=id;capRemember(id);render();break;}
  case'cap-request-work':{const c=capState(),id=element.dataset.id,n=capFindNode(id);if(!n)break;const nu=capNextUseful(n);if(nu){c.selected=nu.id;c.sheet=true;c.depth='route';c.pendingTarget=nu.id;render();break;}c.pendingWork=id;render({keepScroll:true});break;}
  case'cap-confirm-work':{const c=capState();if(!c.pendingWork)break;const wn=capFindNode(c.pendingWork);if(!wn||capPrerequisites(wn).length){c.pendingWork=null;render({keepScroll:true});break;}c.activeNode=c.pendingWork;state.started[state.space]=c.pendingWork;state.chatMode='start';logEvent('Started: '+wn.title,wn.id);c.pendingWork=null;c.sheet=false;if(state.space==='onboard'&&state.ob?.completed)state.ob.active=true;state.returnScreen='map';changeScreen('conversation');break;}
  case'cap-cancel-work':capState().pendingWork=null;render({keepScroll:true});break;
  case'cap-scale':{capState().scale=Number(element.dataset.value);capState().sheet=false;capState().scrollY=0;render({keepScroll:true});break;}
  case'collapse':state.sidebarCollapsed=!state.sidebarCollapsed;render({keepScroll:true});break;
 case'mobile-menu':state.sidebarOpen=true;render({keepScroll:true});break;case'close-sidebar':state.sidebarOpen=false;render({keepScroll:true});break;
 case'theme':state.theme=state.theme==='dark'?'light':'dark';render({keepScroll:true});break;
 case'open-space':openSpace(element.dataset.space);break;
 case'start':state.ob.active=false;state.returnScreen='today';changeScreen('conversation');break;
 case'adjust':state.adjust=!state.adjust;render({keepScroll:true});break;
 case'make-easier':state.shortStep=true;state.adjust=false;render({keepScroll:true});break;
 case'move-later':state.move='Later today';state.adjust=false;render({keepScroll:true});break;
 case'toggle-later':state.showLater=!state.showLater;render({keepScroll:true});break;
 case'map-back':backMap();break;case'map-overview':state.level='overview';render({keepScroll:true});break;
 case'close-node':state.level='cluster';render({keepScroll:true});break;
 case'chat-back':changeScreen(state.returnScreen||'today');break;
 case'preview-node':state.space=(state.scenario==='budget'||state.scenario==='evidence')?'living':'robot';capJump(element.dataset.node,state.screen);break;

 case'cap-complete':{const c=capState(),id=element.dataset.id,n=capFindNode(id),ev=($('#cap-evidence')?.value||'').trim();if(!n||capPrerequisites(n).length)break;if(state.started[state.space]!==id)break;if(!ev){c.notice={id,text:'Add what you finished or found before marking this complete.'};render({keepScroll:true});break;}const d=doneSet();d[id]={evidence:ev,at:Date.now()};delete state.started[state.space];if(c.activeNode===id)c.activeNode=null;const unlocked=STAGE_ORDER.filter(x=>!d[x]&&stageReady(x,d)&&(capStageDeps[x]||[]).includes(id)).map(x=>capProject().nodes[x].title);logEvent('Completed: '+n.title+(unlocked.length?'. Unlocked: '+unlocked.join(', ')+'.':'.'),id);c.notice={id,text:unlocked.length?'Marked complete. Now available: '+unlocked.join(', ')+'.':'Marked complete.'};render({keepScroll:true});break;}

// Canvas edges; actual DOM buttons remain keyboard, touch and mouse accessible.
function connector(ctx,a,b,emphasis){ctx.beginPath();ctx.moveTo(a.x,a.y);const dx=(a.x+b.x)/2;ctx.bezierCurveTo(dx,a.y,dx,b.y,b.x,b.y);ctx.strokeStyle=emphasis?'rgba(153,153,158,.77)':'rgba(139,139,144,.25)';ctx.lineWidth=emphasis?1.65:1.1;ctx.stroke();}
function graphLayout(){const sp=datasets[state.space],groups=sp.clusters;let shown=[],drawn=[],type='cluster';const W=$('#graph-frame')?.clientWidth||900,H=$('#graph-frame')?.clientHeight||550;const mobile=W<520;const groupIndex=Object.fromEntries(groups.map(g=>[g.id,g]));const itemIndex=Object.fromEntries(groups.flatMap(g=>g.items.map(i=>[i.id,i])));let pos={};if(state.level==='overview'){
  const preset8=[[.25,.15],[.75,.15],[.25,.38],[.75,.38],[.25,.61],[.75,.61],[.25,.84],[.75,.84]];
  const preset4=[[.24,.25],[.75,.22],[.24,.72],[.75,.70]];
  const coords=groups.length>5?preset8:preset4;
  shown=groups.map((g,i)=>({id:g.id,title:g.name,meta:g.status,x:coords[i][0]*W,y:coords[i][1]*H,kind:'cluster',affected:state.scenario==='evidence'&&state.space==='living'&&['e','b','d','x'].includes(g.id)}));pos=Object.fromEntries(shown.map(s=>[s.id,s]));
  const combined={};for(const [a,b] of sp.edges){const ag=itemIndex[a]?.group,bg=itemIndex[b]?.group;if(!ag||!bg||ag===bg)continue;const k=[ag,bg].sort().join(':');combined[k]=(combined[k]||0)+1;}
  drawn=Object.entries(combined).map(([key,count])=>({a:key.split(':')[0],b:key.split(':')[1],count,emphasis:key.includes(state.cluster)})).sort((a,b)=>b.count-a.count).slice(0,mobile?12:18);
 } else if(state.level==='cluster'){
  type='item';const g=groupIndex[state.cluster]||groups[0],arr=g.items;
  const pts8=mobile?[[.25,.13],[.75,.13],[.27,.37],[.73,.37],[.25,.60],[.75,.60],[.27,.83],[.73,.83]]:[[.19,.15],[.78,.17],[.50,.31],[.20,.50],[.78,.48],[.21,.79],[.53,.68],[.80,.84]];
  const pts4=[[.26,.24],[.74,.24],[.27,.73],[.74,.70]];
  shown=arr.map((n,i)=>({id:n.id,title:n.label,meta:n.status,x:(arr.length>4?pts8:pts4)[i%((arr.length>4?pts8:pts4).length)][0]*W,y:(arr.length>4?pts8:pts4)[i%((arr.length>4?pts8:pts4).length)][1]*H,kind:'item',affected:state.scenario==='evidence'&&['e1','b4','e4','d1','x6','x2'].includes(n.id)}));pos=Object.fromEntries(shown.map(s=>[s.id,s]));drawn=sp.edges.filter(([a,b])=>pos[a]&&pos[b]).map(([a,b])=>({a,b,emphasis:a===state.node||b===state.node}));
 }else{
  const active=itemIndex[state.node]||itemIndex[sp.focus];const neighbours=sp.edges.filter(([a,b])=>a===active.id||b===active.id).map(([a,b])=>a===active.id?b:a);const uniq=[...new Set(neighbours)];const key=active.id;
  const priorities={e4:['e1','b4','p3','d1','x6','e2'],e1:['b4','e4','a4','e3','e2','e0'],b4:['e1','e4','b3','v0'],r0:['h1','x2','d6','r1'],s1:['g1','s2','t2','s0'],p1:['p0','f0','f1','p2','m0']};const pref=priorities[active.id]||[];const relevant=uniq.sort((a,b)=>{const ia=pref.indexOf(a),ib=pref.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  const pts=mobile?[[.50,.14],[.23,.33],[.77,.33],[.23,.73],[.77,.73],[.50,.89]]:[[.48,.12],[.20,.32],[.81,.30],[.20,.73],[.79,.76],[.49,.87]];
  shown=[{id:key,title:active.label,meta:meta[key]?.status||'Selected',x:W*.50,y:H*.52,kind:'center',affected:false},...relevant.slice(0,6).map((id,i)=>({id,title:itemIndex[id].label,meta:'',x:pts[i][0]*W,y:pts[i][1]*H,kind:'related',affected:state.scenario==='evidence'&&['e1','e4','b4','d1','x6'].includes(id)}))];pos=Object.fromEntries(shown.map(s=>[s.id,s]));drawn=sp.edges.filter(([a,b])=>pos[a]&&pos[b]).map(([a,b])=>({a,b,emphasis:a===key||b===key}));
 }
 return {shown,drawn,pos,W,H};}
function drawMap(){const frame=$('#graph-frame'),nodeHolder=$('#graph-nodes'),canvas=$('#graph-canvas');if(!frame||!nodeHolder||!canvas)return;const {shown,drawn,pos,W,H}=graphLayout();const ratio=window.devicePixelRatio||1;canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);canvas.style.width=W+'px';canvas.style.height=H+'px';const ctx=canvas.getContext('2d');if(!ctx)return;ctx.scale(ratio,ratio);for(const edge of drawn){const a=pos[edge.a],b=pos[edge.b];if(!a||!b)continue;connector(ctx,a,b,edge.emphasis);}
 nodeHolder.innerHTML=shown.map(p=>`<button class="graph-node ${p.kind==='cluster'?'cluster-node':p.kind==='item'?'item-node':p.kind==='center'?'focus-center chosen':'focus-related'} ${p.affected?'affected':''}" style="left:${(p.x/W*100).toFixed(3)}%;top:${(p.y/H*100).toFixed(3)}%" data-graph-id="${esc(p.id)}" data-graph-kind="${p.kind==='cluster'?'cluster':'node'}" aria-label="Open ${esc(p.title)}" title="${esc(p.title)}"><span class="node-title">${esc(p.title)}</span>${p.meta?`<span class="node-meta">${esc(p.meta)}</span>`:''}</button>`).join('');}
function drawMini(){document.querySelectorAll('canvas[data-preview]').forEach(canvas=>{const id=canvas.dataset.preview,par=canvas.parentElement,rect=par.getBoundingClientRect(),W=Math.max(20,rect.width),H=Math.max(20,rect.height),dpr=window.devicePixelRatio||1;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);const ctx=canvas.getContext('2d');if(!ctx)return;ctx.scale(dpr,dpr);const dark=state.theme==='dark';const paths=[[.19,.22],[.72,.20],[.44,.48],[.20,.75],[.78,.78],[.78,.44],[.55,.71],[.18,.48]],n=id==='living'?8:5;const e=id==='living'?[[0,1],[0,2],[1,5],[2,3],[2,5],[3,6],[4,6],[5,4],[2,6],[0,7],[7,3]]:[[0,1],[0,2],[1,2],[2,3],[2,4],[3,4]];ctx.lineWidth=1;ctx.strokeStyle=dark?'#58585e':'#b9b9be';for(const [a,b] of e){ctx.beginPath();ctx.moveTo(paths[a][0]*W,paths[a][1]*H);ctx.lineTo(paths[b][0]*W,paths[b][1]*H);ctx.stroke();}paths.slice(0,n).forEach(([x,y],i)=>{ctx.beginPath();const r=Math.max(4,Math.min(10,W*.023));ctx.arc(x*W,y*H,r,0,Math.PI*2);ctx.fillStyle=i===2?(dark?'#fff':'#121212'):(dark?'#242428':'#fff');ctx.fill();ctx.strokeStyle=i===2?(dark?'#fff':'#121212'):(dark?'#7d7d83':'#b4b4b8');ctx.stroke();});});}

// Touch and pointer-native ranking. Drag the whole card; nearby cards make space as it moves.
let dragRank=null;
document.addEventListener('pointerdown',e=>{

});
document.addEventListener('pointermove',e=>{
 const d=dragRank;if(!d||d.id!==e.pointerId)return;e.preventDefault();
 d.currentY=e.clientY;const dy=e.clientY-d.startY;
 d.card.style.transform=`translateY(${dy}px) scale(1.025)`;
 const others=[...d.list.querySelectorAll('[data-ob-rank-item]')].filter(el=>el!==d.card);
 const target=others.find(el=>e.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);
 const oldPositions=new Map(others.map(el=>[el,el.getBoundingClientRect().top]));
 if(target){if(d.card.nextElementSibling!==target)d.list.insertBefore(d.card,target)}
 else if(d.list.lastElementChild!==d.card)d.list.appendChild(d.card);
 others.forEach(el=>{const shift=oldPositions.get(el)-el.getBoundingClientRect().top;if(Math.abs(shift)>2&&el.animate)el.animate([{transform:`translateY(${shift}px)`},{transform:'translateY(0)'}],{duration:170,easing:'cubic-bezier(.22,.8,.25,1)'});});
 [...d.list.querySelectorAll('[data-ob-rank-item]')].forEach((row,i)=>{const num=row.querySelector('.rank-number');if(num)num.textContent=i+1;});
});
function finishRank(e){const d=dragRank;if(!d||(e&&d.id!==e.pointerId))return;dragRank=null;d.card.classList.remove('dragging');d.card.style.transform='';const list=d.list;if(list&&list.isConnected){state.ob.rank=[...list.querySelectorAll('[data-ob-rank-item]')].map(el=>Number(el.dataset.obRankItem));render({keepScroll:true});}}

let studioDrag=null;

});

});
const finishStudioDrag=e=>{const d=studioDrag;if(!d||d.pointer!==e.pointerId)return;studioDrag=null;d.rows.forEach(r=>{r.style.transform='';r.classList.remove('dragging')});if(d.from===d.to)return;if(d.list.id==='ds-rank'){const arr=[...design.sort];arr.splice(d.to,0,arr.splice(d.from,1)[0]);design.sort=arr;render({keepScroll:true});}else studioRankMove(d.from,d.to);};
