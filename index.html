<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Run a focused test, see what broke, and verify your fix against the same failure."
    />
    <title>Traceyard — Test evidence for your fixes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preload" href="/fonts/instrument-400.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/instrument-600.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      try {
        var theme = localStorage.getItem("traceyard:theme") || "system";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
