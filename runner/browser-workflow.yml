name: Traceyard browser replay
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: traceyard-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision == 'baseline' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceyard-build-${{ matrix.revision }}
          path: __BUILD_PATH__/
          if-no-files-found: error
          retention-days: 1
  replay:
    name: Traceyard browser comparison
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed journey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reviewed
          sparse-checkout: |
            .traceyard/browser/
            .traceyard/browser-journey.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Locate journey on base revision
        id: journey
        run: |
          shopt -s nullglob
          journeys=(reviewed/.traceyard/browser/*.json)
          if test -f reviewed/.traceyard/browser-journey.json || (( ${#journeys[@]} > 0 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge the reviewed journey to enable comparison on later pull requests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout Traceyard
        if: steps.journey.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fysaio/traceyard
          ref: __RUNNER_REVISION__
          path: replay-engine
          persist-credentials: false
      - name: Download browser builds
        if: steps.journey.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: traceyard-build-*
          path: builds
      - name: Prepare browser runner
        if: steps.journey.outputs.ready == 'true'
        run: docker build -f replay-engine/runner/browser.Dockerfile -t traceyard-browser replay-engine
      - name: Compare with network disabled
        if: steps.journey.outputs.ready == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p evidence
          touch evidence/summary.md
          set +e
          bash replay-engine/runner/browser-check.sh \
            "$PWD/reviewed/.traceyard" \
            "$BASE_SHA" "$HEAD_SHA" \
            "$PWD/builds/traceyard-build-baseline" \
            "$PWD/builds/traceyard-build-candidate" \
            "$PWD/evidence"
          result=$?
          set -e
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain browser comparison
        if: always() && steps.journey.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceyard-browser-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
